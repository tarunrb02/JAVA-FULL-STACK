<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <div>
            <input type="text" id="ticketname" placeholder="Customer Name">
            <input type="text" id="ticketissue" placeholder="Customer Issue">
            <script src="script.js"></script>
        </div>
        <div>
            <select name="" id="ticketpriority">
                <option value="">Normal</option>
                <option value="">High</option>
                <option value="">Critical</option>
            </select>
        </div>

        <button id="createTicket">Create Ticket</button>

        <input type="text" id="searchTicket" placeholder="Search Ticket">
        <!-- <button id="searchTicketButton">Search</button> -->
        <div id="ticketList">
            <!-- Tickets will be displayed here -->
        </div>
        <div id="ticketsummery">
            <!-- Ticket summary will be displayed here -->
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
