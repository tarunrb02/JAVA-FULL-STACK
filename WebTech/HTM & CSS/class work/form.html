<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>

<form action="./index.html" target="_blank" >

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <br><br>

    <label for="number">Number:</label>
    <input type="text" id="number" name="number" 
           pattern="[0-9]{10}" 
           placeholder="Enter 10 digit number" required>

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>

    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>

    <input type="radio" name="gender" id="other" value="other">
    <label for="other">Other</label>

    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" name="dob" id="dob">

    <br><br>

    <label>Course:</label>

    <input type="checkbox" name="course" value="HTML" id="html">
    <label for="html">HTML</label>

    <input type="checkbox" name="course" value="CSS" id="css">
    <label for="css">CSS</label>

    <input type="checkbox" name="course" value="JavaScript" id="js">
    <label for="js">JavaScript</label>

    <input type="checkbox" name="course" value="Python" id="python">
    <label for="python">Python</label>

    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
